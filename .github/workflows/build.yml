name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The mob model bundles are gitignored, so a CI checkout builds the addon's own
      # code and resources only. That is exactly what a clean clone gets, and it is the
      # configuration the build has to keep working in.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload the jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CNPC-Gecko-Addon
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
